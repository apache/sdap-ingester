[tool.poetry]
name = "sdap_granule_ingester"
version = "1.4.0"
description = "Ingester component for Apache SDAP"
authors = ["SDAP PMC <dev@sdap.apache.org>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "granule_ingester" }
]
repository = "https://github.com/apache/incubator-sdap-ingester"
classifiers=[
    'Development Status :: 6 - Mature',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.11',
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
cassandra-driver = "3.30.0"
aiomultiprocess = "0.7.0"
aioboto3 = "11.3.0"
aiobotocore = "2.6.0"
boto3 = "1.28.17"
tblib = "1.6.0"
pysolr = "3.10.0"
kazoo = "2.8.0"
aio-pika = "6.7.1"
elasticsearch = { version = "8.11.0", extras = ["async"]}
urllib3 = "1.26.20"
numpy = "^1.26.4"
scipy = "^1.11.4"
netcdf4 = "^1.6.5"
pandas = "^2.1.4"
pytz = "^2024.1"
xarray = "*"
pyyaml = "6.0.2"
aiohttp = ">=3.8.0"
tenacity = "8.2.3"
requests = ">=2.27.1"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
