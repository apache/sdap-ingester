[project]
name = "collection_manager"
version = "0.1.0"
description = "TBD"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "common",

    "aio-pika==6.7.1",
    "aioboto3==11.3.0",
    "aiobotocore==2.6.0",
    "aiohttp==3.8.5",
    "boto3==1.28.17",
    "pysolr==3.10.0",
    "pyyaml==6.0.2",
    "requests==2.31.0",
    "tenacity==8.2.3",
    "urllib3==1.26.20",
    "watchdog==0.10.2",
    "yarl<=1.9.4",
]


[dependency-groups]
dev = ["pytest>=7.1.2,<8"]

[tool.uv]

[tool.uv.build-backend]
module-name = ["collection_manager"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
