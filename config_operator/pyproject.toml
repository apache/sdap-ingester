[project]
name = "config_operator"
version = "0.1.0"
description = "TBD"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "gitpython==3.1.2",
    # kopf 0.26 (2020) cannot import on Python 3.11 (dataclass mutable-default
    # error); 1.36+ adds 3.11 support. HandlerFatalError was renamed
    # PermanentError in the 1.x line (see main.py).
    "kopf>=1.36,<2",
    "kubernetes>=27,<31",
]


[dependency-groups]
dev = ["pytest>=7.1.2,<8"]

[tool.uv]

[tool.uv.build-backend]
module-name = ["config_operator"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

