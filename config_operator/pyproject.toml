[project]
name = "config_operator"
version = "0.1.0"
description = "TBD"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "gitpython==3.1.2",
    "kopf==0.26",
    "kubernetes==11.0",
]


[dependency-groups]
dev = ["pytest>=7.1.2,<8"]

[tool.uv]

[tool.uv.build-backend]
module-name = ["config_operator"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

