[project]
name = "config_operator"
version = "1.4.0"
description = "a service to synchronize git or local directory configuration with k8s configMap"
readme = "README.md"
authors = [{ name = "SDAP PMC", email = "dev@sdap.apache.org" }]
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
classifiers=[
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
        "Development Status :: 4 - Beta",
    ]
dependencies = [
    "gitpython==3.1.2",
    # kopf 0.26 (2020) cannot import on Python 3.11 (dataclass mutable-default
    # error); 1.36+ adds 3.11 support. HandlerFatalError was renamed
    # PermanentError in the 1.x line (see main.py).
    "kopf>=1.36,<2",
    "kubernetes>=27,<31",
]

[project.urls]
Repository = "https://github.com/tloubrieu-jpl/incubator-sdap-nexus-ingestion-manager"

[dependency-groups]
dev = ["pytest>=7.1.2,<8"]

[tool.uv]

[tool.uv.build-backend]
module-name = ["config_operator"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

